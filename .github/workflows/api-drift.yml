name: Braintrust API drift

on:
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [braintrust-openapi-updated]

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download upstream public contract
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/braintrustdata/braintrust-openapi/commits/main --jq .sha)
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/braintrustdata/braintrust-openapi/${sha}/openapi/spec.json" \
            --output upstream-spec.json
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Compare provider contract
        run: |
          python3 scripts/check_api_drift.py --spec upstream-spec.json \
            --upstream-sha "${{ steps.upstream.outputs.sha }}" \
            --output drift-issue.md --status drift-status.json
      - name: Create or update review issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRIFT_BODY: drift-issue.md
          DRIFT_STATUS: drift-status.json
        run: python3 scripts/sync_api_drift_issue.py
