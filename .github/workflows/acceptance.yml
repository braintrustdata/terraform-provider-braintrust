name: Acceptance Tests

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-acc-tests')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run acceptance tests
        run: go test -v -mod=readonly -count=1 -p 5 -parallel 10 -timeout 600s ./internal/provider/
        env:
          TF_ACC: "1"
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
