name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Require a tag on current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release source
        run: |
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...

      - name: Verify generated documentation
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform_1.15.8_linux_amd64.zip
          unzip -q /tmp/terraform_1.15.8_linux_amd64.zip terraform -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          go generate ./...
          git diff --exit-code -- docs/

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # goreleaser only supports one checksum config, which is reserved for the
      # provider's SHA256SUMS (read by the Terraform Registry).
      - name: Upload CLI checksums
        working-directory: dist
        run: |
          checksums="braintrust-terraforming_${GITHUB_REF_NAME#v}_checksums.txt"
          sha256sum braintrust-terraforming_*.tar.gz braintrust-terraforming_*.zip > "$checksums"
          gh release upload "$GITHUB_REF_NAME" "$checksums"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
