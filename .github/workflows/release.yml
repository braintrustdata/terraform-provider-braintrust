name: Release

on:
  push:
    tags:
      - "v*"
  # Releasing from the Actions UI creates the tag on main for you.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3 or 1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          # Semantic Versioning 2.0.0 (https://semver.org), with a required "v" prefix.
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$num\.$num\.$num(-$ident(\.$ident)*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?\$"
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::$tag is not a valid semantic version"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require the release commit to be current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform 1.15.8
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform_1.15.8_linux_amd64.zip
          unzip -q /tmp/terraform_1.15.8_linux_amd64.zip terraform -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      # Same checks CI runs on pull requests, including tests/offline.
      - name: Verify release source
        run: make check

  acceptance:
    name: Acceptance Tests
    needs: verify
    uses: ./.github/workflows/acceptance.yml
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: [verify, acceptance]
    runs-on: ubuntu-24.04
    environment: release
    concurrency: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Pushed with GITHUB_TOKEN, so it doesn't trigger this workflow again.
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Check provider release files
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          prefix="terraform-provider-braintrust_${TAG#v}"
          for f in "${prefix}_SHA256SUMS" "${prefix}_SHA256SUMS.sig" "${prefix}_manifest.json"; do
            grep -qxF "$f" <<<"$assets" || { echo "::error::$TAG is missing $f"; exit 1; }
          done
          if grep -q '^braintrust-terraforming' <<<"$assets"; then
            echo "::error::$TAG must not include CLI archives"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Registry serves any archive in the provider's release whose name ends in
      # _<os>_<arch>, so the CLI gets its own release. "cli-v*" isn't semver, so the
      # Registry ignores it, and --latest=false keeps the provider release as latest.
      - name: Publish CLI release
        working-directory: dist
        run: |
          checksums="braintrust-terraforming_${TAG#v}_checksums.txt"
          sha256sum braintrust-terraforming_*.tar.gz braintrust-terraforming_*.zip > "$checksums"
          gh release create "cli-$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "braintrust-terraforming $TAG" \
            --notes "braintrust-terraforming CLI built from $TAG." \
            braintrust-terraforming_*.tar.gz braintrust-terraforming_*.zip "$checksums"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
