provider:
  name: braintrust

resources:
  project:
    create:
      path: /v1/project
      method: POST
    read:
      path: /v1/project/{project_id}
      method: GET
    update:
      path: /v1/project/{project_id}
      method: PATCH
    delete:
      path: /v1/project/{project_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          project_id: id
      ignores:
        - org_name

data_sources:
  project:
    read:
      path: /v1/project/{project_id}
      method: GET
    schema:
      attributes:
        aliases:
          project_id: id
