version: 2
# Explicit so checksum, signature, and manifest names don't depend on the git remote.
project_name: terraform-provider-braintrust
builds:
  - id: provider
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"
  - id: braintrust-terraforming
    main: ./cmd/braintrust-terraforming
    binary: braintrust-terraforming
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - id: provider
    ids:
      - provider
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: braintrust-terraforming
    ids:
      - braintrust-terraforming
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "braintrust-terraforming_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  # The Terraform Registry maps every archive listed here to a platform by file
  # name, so keep it provider-only. The CLI ships in its own release (release.yml).
  ids:
    - provider
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  # Listed in release.ids below; without that, the signature is not uploaded.
  - id: registry-signature
    artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  # The Registry rejects a release with archives missing from SHA256SUMS, so leave
  # the CLI archives out. release.yml publishes them in a separate cli-v* release.
  ids:
    - provider
    - registry-signature
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
changelog:
  # GitHub's generated notes; .github/release.yml filters the entries.
  use: github-native
