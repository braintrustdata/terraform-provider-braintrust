version: "2"
linters:
  enable:
    - gocritic
    - misspell
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # Imported braintrust-terraforming code predates this lint config; see TODO.md.
      - linters:
          - errcheck
          - gocritic
          - staticcheck
        path: ^internal/terraforming/
    paths:
      - dist
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - dist
      - third_party$
      - builtin$
      - examples$
